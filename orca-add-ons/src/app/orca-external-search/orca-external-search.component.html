<div class="external-search-wrapper">
  <button type="button"
          class="external-search-trigger"
          [attr.aria-expanded]="isOpen"
          aria-haspopup="menu"
          [attr.aria-label]="facetName"
          (click)="toggleMenu()">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </button>

  <div class="external-search-menu" *ngIf="isOpen" role="menu">
    <h2 class="mat-title-medium external-search-menu-title">{{ facetName }}</h2>

    <p><img src="{{ worldcatLogoUrl }}" alt="WorldCat Logo"><a target="_blank" rel="noopener noreferrer"
                    [href]="worldcatSearchUrl">{{ worldcatBrandName }}</a></p>
    <p><img src="{{ googleScholarLogoUrl }}" alt="Google Scholar Logo"><a target="_blank" rel="noopener noreferrer"
                    href="https://scholar.google.com/scholar?q={{ searchTerms }}">Google Scholar</a></p>
    <p><img src="{{ baseLogoUrl }}" alt="Base Logo"><a target="_blank" rel="noopener noreferrer"
                    [href]="baseSearchUrl">Base</a></p>
    <p><img src="{{ lensLogoUrl }}" alt="Lens Logo"><a target="_blank" rel="noopener noreferrer"
                    [href]="lensSearchUrl">Lens</a></p>
    <p><img src="{{ isidoreLogoUrl }}" alt="Isidore Logo"><a target="_blank" rel="noopener noreferrer"
                    [href]="isidoreSearchUrl">Isidore</a></p>
    <p><img src="{{ pubmedLogoUrl }}" alt="PubMed Logo"><a target="_blank" rel="noopener noreferrer"
                    [href]="pubmedSearchUrl">PubMed</a></p>
    <p><img src="{{ scopusLogoUrl }}" alt="Scopus Logo"><a target="_blank" rel="noopener noreferrer"
                    [href]="scopusSearchUrl">Scopus</a></p>
  </div>
</div>
